<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WebSocket Live Test Rig</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background:
                #121212;
            color: #fff;
        }

        #log {
            background: #000;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #333
        }

        .status-on {
            color: #00ff00
        }

        .status-off {
            color: #ff0000
        }
    </style>
</head>

<body>
    <h1>webSocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting...</p>

    <form id="message-form"> 
        <input id="message-input" type="text" placeholder="Send cargo ..." required />
        <button type="submit">Send</button>
    </form>

    <h3>Live Stream Logs:</h3>
    <pre id="log"></pre>
</body>

<script>
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const messageFormEl = document.getElementById('message-form');
    const messageInputEl = document.getElementById('message-input');

    //1. Initiate handshake
    const socket = new WebSocket('ws://localhost:8000');

    const appendLog = (label,message) => {
        const entry = `${new Date().toLocaleDateString()} ${label} : ${message} \n`;
        logEl.textContent = entry + logEl.textContent;
    }

    socket.addEventListener("open", () => {
        statusEl.textContent = "CONNECTED: ws://localhost:8000";
        statusEl.className = "status-on";

        appendLog("[SYSTEM]", "Tunnel Established.")
    })

    socket.addEventListener("close",() => {
        statusEl.textContent = "DISCONNECTED: ws://localhost:8000";
        statusEl.className = "status-off";

        appendLog("[SYSTEM]", "Tunnel Disconnected.")
    })

    socket.addEventListener("message", (e) => {
        appendLog("[RECEIVED]", e.data)
    })

    messageFormEl.addEventListener('submit', (e) => {
        e.preventDefault();

        if(socket.readyState !== WebSocket.OPEN){
            appendLog("[ERROR]", "No active tunnel connection founded.")

            return;
        }
        
        const message = messageInputEl.value.trim();

        socket.send(message);
        appendLog("[SENT]", message);

        messageInputEl.value = "";
    });

</script>
</html>
